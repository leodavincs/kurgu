# Runs the ffmpeg-heavy tests against pinned static ffmpeg builds, so we know which versions Kurgu really works with.
# Separate from ci.yml on purpose: the required checks there stay exactly as they are, and Mac/Windows minutes do not multiply.
# Keep the lowest version here in sync with MIN_FFMPEG in doctor.py, and the README "FFmpeg compatibility" line.
name: ffmpeg-compat

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KURGU_NO_SANDBOX: "1"     # CI containers cannot run Chrome's sandbox; everywhere else Kurgu keeps it on

jobs:
  ffmpeg-compat:
    name: ffmpeg-compat / ${{ matrix.ffmpeg }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # BtbN/FFmpeg-Builds monthly autobuild tags (the monthly ones are kept; dailies are pruned). GPL, linux64, static.
          - ffmpeg: "6.1"
            tag: autobuild-2025-08-31-13-00
            file: ffmpeg-n6.1.3-linux64-gpl-6.1.tar.xz
            sha256: 400f9ca9d8ea3f812660cf7a00b9bfed944175cd9d6bd0c9b6257cf99376a75c
          - ffmpeg: "7.1"
            tag: autobuild-2026-07-31-14-10
            file: ffmpeg-n7.1.5-12-g1fdbca85aa-linux64-gpl-7.1.tar.xz
            sha256: c1e6caf48923dd8e6bc5e54d51ba70c321175b8162ae9c414c392990e72f0e79
          - ffmpeg: "8.1"
            tag: autobuild-2026-08-31-13-27
            file: ffmpeg-n8.1.2-50-g1a748fe2cd-linux64-gpl-8.1.tar.xz
            sha256: c733b4b2951e5957e15505f788b2c65a7a41b6da4b289e295852cc38079b4d2b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore ffmpeg download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/ffmpeg-dl
          key: ffmpeg-${{ matrix.sha256 }}

      - name: Install pinned ffmpeg ${{ matrix.ffmpeg }}
        env:
          URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/${{ matrix.tag }}/${{ matrix.file }}
        run: |
          set -euo pipefail
          mkdir -p ~/ffmpeg-dl ~/ffmpeg-bin
          if [ ! -f ~/ffmpeg-dl/${{ matrix.file }} ]; then
            curl -fsSL --retry 5 --retry-delay 5 -o ~/ffmpeg-dl/${{ matrix.file }} "$URL"
          fi
          echo "${{ matrix.sha256 }}  $HOME/ffmpeg-dl/${{ matrix.file }}" | sha256sum -c -
          tar -xJf ~/ffmpeg-dl/${{ matrix.file }} -C ~/ffmpeg-bin --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          echo "$HOME/ffmpeg-bin" >> "$GITHUB_PATH"
          echo "KURGU_FFMPEG=$HOME/ffmpeg-bin/ffmpeg" >> "$GITHUB_ENV"
          echo "KURGU_FFPROBE=$HOME/ffmpeg-bin/ffprobe" >> "$GITHUB_ENV"

      - name: Show and check the ffmpeg version
        run: |
          set -euo pipefail
          command -v ffmpeg
          ffmpeg -version | head -3
          ffprobe -version | head -1
          ffmpeg -version | head -1 | grep -E "version n?${{ matrix.ffmpeg }}[.-]"
          [ "$(command -v ffmpeg)" = "$HOME/ffmpeg-bin/ffmpeg" ]

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1
        continue-on-error: true
        id: chrome

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest websocket-client

      - name: Doctor
        run: python doctor.py --json | head -60

      # The subset that shells out to ffmpeg/ffprobe: export + hardware-encoder probing + encoders (render, export),
      # proxies / waveforms / probes / loudness (perf, media_tools), silencedetect + levels (audio_facts),
      # strip / frame renders, agent notes, Chrome-vs-render frame parity (needs Chrome), keyframe + motion renders.
      - name: ffmpeg-heavy tests
        env:
          KURGU_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          PYTHONUTF8: "1"
        run: |
          python -m pytest -q -ra \
            tests/test_render.py tests/test_export.py tests/test_audio_facts.py tests/test_strip.py \
            tests/test_perf.py tests/test_agent_notes.py tests/test_motion.py \
            tests/test_parity.py tests/test_kf_parity.py tests/test_install.py
