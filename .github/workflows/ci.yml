name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      # Chrome powers the UI and preview/render parity tests; they skip themselves when it is missing.
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        continue-on-error: true
        id: chrome

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest websocket-client

      - name: Dependency check
        run: python scripts/check_deps.py

      - name: Tests
        env:
          KURGU_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          PYTHONUTF8: "1"
        run: python -m pytest -q

  package:
    name: build wheel + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
      - name: Entry points run
        run: |
          /tmp/venv/bin/kurgu --help
          /tmp/venv/bin/kurgu-render --help
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | /tmp/venv/bin/kurgu-mcp | grep -q '"name":"kurgu"'
